<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiro acesso por convite · EDU.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<main class="centralizado">
  <a class="logo" href="../index.html"><span class="logo__marca"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#172033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg></span><span class="logo__textos"><span class="logo__nome">EDU.AI</span><span class="logo__sub">Plataforma de aprendizagem</span></span></a>
  <form class="cartao acesso__caixa" style="padding:32px" data-demo="../professor/visao-geral.html">
    <h2>Convite de Colégio Exemplo</h2>
    <p>Você foi convidado como <span class="tag tag--azul">Professor</span></p>
    <p class="texto-suave">Crie sua senha para ativar a conta e acessar suas turmas.</p>
    <label class="campo"><span>Nome completo</span><input class="entrada" type="text" value="Ana Souza" placeholder=""></label>
    <label class="campo"><span>E-mail</span><input class="entrada" type="email" value="ana.souza@colegio.edu.br" placeholder=""></label>
    <label class="campo"><span>Criar senha</span><input class="entrada" type="password" value="" placeholder="••••••••"></label>
    <label class="campo"><span>Confirmar senha</span><input class="entrada" type="password" value="" placeholder="••••••••"></label>
    <label class="check"><input type="checkbox"> Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a></label>
    <button type="submit" class="btn btn--primario btn--g btn--bloco">Ativar conta</button>
  </form>
  <div class="aviso aviso--azul"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><p>Alunos podem entrar também com o código da turma, informado pelo professor.</p></div>
</main>
<script src="../assets/js/app.js"></script>
</body>
</html>
